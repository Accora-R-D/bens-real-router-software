services:
  - type: web
    name: bens-real-router-software
    runtime: python
    runtimeVersion: "3.12.0"
    buildCommand: pip install -r app/requirements.txt
    startCommand: bash -c 'cd /opt/render/project/src/app && python -m uvicorn backend.main:app --host 0.0.0.0 --port $PORT'
    healthCheckPath: /cam/defaults
